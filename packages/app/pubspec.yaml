name: pagestage_app
description: Listening-first novel reader app for Android and iOS.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  intl: any
  pagestage_core:
    path: ../core
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.3
  flutter_soloud: ^5.2.1
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/examples/
    - assets/fonts/NotoSerifSC-OFL.txt
    - assets/fonts/Newsreader-OFL.txt
    - assets/fonts/InstrumentSans-OFL.txt
    - assets/fonts/DMMono-OFL.txt
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
        - asset: assets/fonts/Newsreader-Italic-Variable.ttf
          style: italic
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
