name: pagestage_app
description: Listening-first novel reader app for Android and iOS.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/NotoSerifSC-OFL.txt
    - assets/fonts/Newsreader-OFL.txt
    - assets/fonts/InstrumentSans-OFL.txt
    - assets/fonts/DMMono-OFL.txt
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
        - asset: assets/fonts/Newsreader-Italic-Variable.ttf
          style: italic
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
